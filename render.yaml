services:
  - type: web
    name: the-shrub-lodge-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ADMIN_API_PROXY_SECRET
        sync: false
      - key: CONTACT_API_PROXY_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_RESET_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        value: https://the-shrub-lodge.vercel.app
